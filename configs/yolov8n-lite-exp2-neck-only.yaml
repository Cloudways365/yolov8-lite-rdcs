# 消融实验 Exp-2：仅改 Neck（C2f开ghost + 下采样Conv开slim/GSConv），Backbone保持官方不动，Head 官方不动

nc: 8  # 8类航天器
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                              # 1-P2/4
  - [-1, 3, C2f, [128, True]]                               # 2   浅层：官方 C2f
  - [-1, 1, Conv, [256, 3, 2]]                              # 3-P3/8
  - [-1, 6, C2f, [256, True]]                               # 4   深层：官方 C2f（不加开关，本次不改）
  - [-1, 1, Conv, [512, 3, 2]]                              # 5-P4/16
  - [-1, 6, C2f, [512, True]]                               # 6   深层：官方 C2f（不加开关，本次不改）
  - [-1, 1, Conv, [1024, 3, 2]]                             # 7-P5/32
  - [-1, 3, C2f, [1024, True]]                              # 8   深层：官方 C2f（不加开关，本次不改）
  - [-1, 1, SPPF, [1024, 5]]                                # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False, 1, 0.5, True]]                # 12  Neck：开 ghost 开关（本次改动）

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256, False, 1, 0.5, True]]                # 15 (P3/8-small) Neck：开 ghost 开关（本次改动）

  - [-1, 1, Conv, [256, 3, 2, None, 1, 1, True, True]]      # 16  Neck下采样：开 slim(GSConv) 开关（本次改动）
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False, 1, 0.5, True]]                # 18 (P4/16-medium) Neck：开 ghost 开关（本次改动）

  - [-1, 1, Conv, [512, 3, 2, None, 1, 1, True, True]]      # 19  Neck下采样：开 slim(GSConv) 开关（本次改动）
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024, False, 1, 0.5, True]]               # 21 (P5/32-large) Neck：开 ghost 开关（本次改动）

  - [[15, 18, 21], 1, Detect, [nc]]                         # 22  官方 Detect 头，不改动
