# RDCS 数据集配置文件（Snowbluerose/RDCS-dataset：航天器 RGB-D 位姿估计数据集）

path: /data_d/RDCS/   # 数据集根目录
train: images/train      # 训练集图片目录（相对 path）
val: images/val          # 验证集图片目录（相对 path）
test: images/test        # 测试集图片目录（相对 path）

names:
  0: general_satellite   # 通用卫星
  1: b330                # B330
  2: dragon2             # Dragon 2
  3: cygnus_enhanced     # Enhanced Cygnus
  4: nauka               # Nauka
  5: cst100_starliner    # CST-100 Starliner
  6: dream_chaser        # Dream Chaser
  7: boeing_airlock      # Boeing Airlock

